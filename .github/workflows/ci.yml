name: ci
on:
  push: {}
  pull_request: {}
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/ingest/requirements*.txt
      - run: pip install -r server/ingest/requirements-dev.txt && pip install -e server/ingest
      - run: pytest server/ingest -m "not db"
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: database/test } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: database/test/package-lock.json }
      - run: npm ci
      - run: npm test
