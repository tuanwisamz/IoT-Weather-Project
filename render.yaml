# Render Blueprint: the dashboard as a free static site. Secrets are set in the Render dashboard.
services:
  - type: web
    name: iskandar-weather-watch
    runtime: static
    rootDir: client/Iotweatherproject
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
